[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfinvoice"
version = "0.1.0"
description = "Read invoice data from PDF files on the command line, using text extraction and rules only."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
web = ["flask>=3"]
dev = ["pytest>=7", "reportlab>=4", "flask>=3"]

[project.scripts]
pdfinvoice = "pdfinvoice.cli:main"
pdfinvoice-web = "pdfinvoice.web:main"

[tool.setuptools]
packages = ["pdfinvoice"]

[tool.setuptools.package-data]
pdfinvoice = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
